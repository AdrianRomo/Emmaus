services:
  web:
    build: .
    command: gunicorn emmaus.wsgi:application --bind 0.0.0.0:8000 --workers 3
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DEBUG: "false"
      DATABASE_URL: postgres://emmaus:${POSTGRES_PASSWORD}@db:5432/emmaus
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - staticfiles:/app/staticfiles

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: emmaus
      POSTGRES_USER: emmaus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emmaus -d emmaus"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  staticfiles:
