# Migration governance while the camp runs on main (docs/decisions/0005): a PR against
# v2/foundation must not add migrations under core/ or events/. Its own workflow so that adding or
# removing the bypass label `area:camp` reruns the guard (a label change does not rerun CI).
name: Migration scope

on:
  pull_request:
    branches: [v2/foundation]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: migration-scope-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: No core/ or events/ migrations on v2 branches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: origin/${{ github.base_ref }}
      ALLOW_CAMP_MIGRATIONS: ${{ contains(github.event.pull_request.labels.*.name, 'area:camp') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/agents/check-migration-scope.sh
