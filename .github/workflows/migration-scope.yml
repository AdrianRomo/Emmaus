# Migration governance on the v2 branches (docs/decisions/0013): a PR against v2/foundation adds
# only additive migrations. Its own workflow so that adding or removing the bypass label `risk:high`
# reruns the guard (a label change does not rerun CI).
name: Migration scope

on:
  pull_request:
    branches: [v2/foundation]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: migration-scope-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Only additive migrations on v2 branches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: origin/${{ github.base_ref }}
      ALLOW_DESTRUCTIVE_MIGRATIONS: ${{ contains(github.event.pull_request.labels.*.name, 'risk:high') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/agents/check-migration-scope.sh
