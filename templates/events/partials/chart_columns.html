{% load emmaus %}
<figure class="chart">
  <figcaption>
    <p class="chart__title">Ritmo de entrevistas</p>
    <p class="chart__sub">Entrevistas completadas por hora{% if as_of %} · datos al {{ as_of|as_datetime|date:"H:i" }}{% endif %}</p>
  </figcaption>
  {% if points %}
    {% columns_chart points chart_id "Entrevistas completadas por hora" %}
  {% else %}
    <p class="chart__empty">Sin datos todavía.</p>
  {% endif %}
</figure>
