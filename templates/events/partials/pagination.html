{% if page.has_other_pages %}
<nav class="cluster cluster--between mt-6" aria-label="Páginas">
  {% if page.has_previous %}<a class="btn btn--sm" href="?{% for k, v in request.GET.items %}{% if k != 'pagina' %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}pagina={{ page.previous_page_number }}">Anterior</a>{% else %}<span></span>{% endif %}
  <span class="folio">Página {{ page.number }} de {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn--sm" href="?{% for k, v in request.GET.items %}{% if k != 'pagina' %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}pagina={{ page.next_page_number }}">Siguiente</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
