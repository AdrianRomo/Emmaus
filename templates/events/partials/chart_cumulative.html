{% load emmaus %}
<figure class="chart">
  <figcaption>
    <p class="chart__title">Entrevistas completadas, acumuladas</p>
    <p class="chart__sub">Número de entrevistas · la línea horizontal es el total de participantes ({{ total }}){% if as_of %} · datos al {{ as_of|as_datetime|date:"H:i" }}{% endif %}</p>
  </figcaption>
  {% if points %}
    {% cumulative_chart points total chart_id "Entrevistas completadas acumuladas" %}
    <details>
      <summary>Ver los datos en una tabla</summary>
      <div class="table-wrap mt-2" tabindex="0" role="region" aria-label="Tabla"><table class="table"><thead><tr><th>Hora</th><th class="num">En esa hora</th><th class="num">Acumuladas</th></tr></thead>
        <tbody>{% for p in points %}<tr><td>{% if p.day %}{{ p.day }} {% endif %}{{ p.label }}</td><td class="num">{{ p.count }}</td><td class="num">{{ p.cumulative }}</td></tr>{% endfor %}</tbody></table></div>
    </details>
  {% else %}
    <p class="chart__empty">Aún no hay entrevistas completadas. La gráfica aparecerá con la primera.</p>
  {% endif %}
</figure>
