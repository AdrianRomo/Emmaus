{% extends "events/shell_rail.html" %}
{% block page_title %}Avance {{ event.of_kind }}{% endblock %}
{% block content %}
<header class="page-head"><p class="folio">{{ event.name }}</p><div class="page-head__row"><h1>Avance {{ event.of_kind }}</h1><a class="btn" href="{% url 'events:interviews' event.slug %}">Ver entrevistas</a></div>{% include "partials/ui/live_status.html" %}</header>
<div id="avance-vivo" data-live-url="{% url 'events:progress' event.slug %}" data-live-interval="30" data-live-status="estado-actualizacion">
  {% include "events/pastor/_progress_live.html" %}
</div>
{% endblock %}
