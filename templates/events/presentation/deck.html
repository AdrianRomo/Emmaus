{% extends "layout/skeleton.html" %}
{% load emmaus %}
{% block title %}Modo presentación · {{ deck.event_name }}{% endblock %}
{% block body %}
<main id="contenido" class="deck" aria-roledescription="presentación" aria-label="Modo presentación de {{ deck.event_name }}">
  <h1 class="visually-hidden">Modo presentación de {{ deck.event_name }}</h1>
  <div class="deck__frame"{% if live %} data-live-url="{% url 'events:presentation_live' event.slug %}" data-live-interval="60" data-live-status="deck-estado" id="diapositivas"{% endif %}>
    {% include "events/presentation/_slides.html" %}
  </div>
  <nav class="deck-controls" aria-label="Controles de la presentación">
    <a class="btn" href="{% if snapshot %}{% url 'events:report_detail' event.slug snapshot.public_id %}{% else %}{% url 'events:home' event.slug %}{% endif %}">Salir</a>
    <button class="btn" type="button" data-deck-prev>Anterior</button>
    <span class="deck-controls__count" data-deck-count aria-live="polite">1 de 5</span>
    <button class="btn" type="button" data-deck-next>Siguiente</button>
    <button class="btn" type="button" data-deck-full>Pantalla completa</button>
    <button class="btn" type="button" data-deck-theme aria-pressed="false">Modo noche</button>
    {% if live %}<span class="deck-controls__count live-status" id="deck-estado" data-state="ok" aria-live="polite">En vivo</span>{% endif %}
  </nav>
</main>
{% endblock %}
