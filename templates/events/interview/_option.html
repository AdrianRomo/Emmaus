<div class="option{% if q.is_multi %} option--multi{% endif %}{% if quiet %} option--quiet{% endif %}">
  <input type="{% if q.is_multi %}checkbox{% else %}radio{% endif %}" id="{{ o.id }}" name="{{ q.name }}" value="{{ o.option.code }}"{% if o.checked %} checked{% endif %}{% if o.option.is_exclusive and q.is_multi %} data-exclusive{% endif %}{% if q.error %} aria-describedby="q{{ q.question.id }}-error"{% endif %}>
  <label class="option__face" for="{{ o.id }}"><span class="option__mark" aria-hidden="true"></span><span>{{ o.option.label }}</span></label>
</div>
