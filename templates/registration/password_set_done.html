{% extends "base.html" %}
{% block page_title %}Contraseña lista{% endblock %}
{% block content %}
<div class="auth-card">
  <section class="confirm" aria-labelledby="lista">
    <h1 id="lista" class="voice confirm__title">Tu contraseña quedó lista</h1>
    <p class="confirm__text">Ya puedes entrar a Emmaus con tu correo y tu nueva contraseña.</p>
  </section>
  <div class="step__actions">
    <a class="btn btn--primary btn--large" href="{% url 'login' %}">Entrar a Emmaus</a>
  </div>
</div>
{% endblock %}
