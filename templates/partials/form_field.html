<div class="mb-5">
  {% if field.field.widget.input_type == "checkbox" %}
    <label class="flex items-start gap-2 rounded-xl border border-stone-200 bg-white/60 p-3 font-semibold">
      {{ field }}
      <span>
        {{ field.label }}{% if field.field.required %}<span class="text-amber-800" aria-hidden="true"> *</span>{% endif %}
        {% if field.help_text %}<span class="helptext">{{ field.help_text }}</span>{% endif %}
      </span>
    </label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="text-amber-800" aria-hidden="true"> *</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<span class="helptext">{{ field.help_text }}</span>{% endif %}
  {% endif %}
  {{ field.errors }}
</div>
