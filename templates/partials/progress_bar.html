<div class="meter">
  <div class="meter__head"><strong>{{ label|default:"Avance" }}</strong><span class="num">{{ percent|default:0 }} %</span></div>
  <div class="meter__track" role="img" aria-label="{{ label|default:'Avance' }}: {{ percent|default:0 }} %"><span class="meter__seg meter__seg--done" style="width: {{ percent|default:0 }}%"></span></div>
</div>
