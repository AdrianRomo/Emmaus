{% if form.non_field_errors %}<div class="notice notice--danger">{% for error in form.non_field_errors %}<p>{{ error }}</p>{% endfor %}</div>{% endif %}
{% for field in form.hidden_fields %}{{ field }}{% endfor %}
{% for field in form.visible_fields %}{% include "partials/ui/field.html" with field=field %}{% endfor %}
