<header class="page-head">
  {% if eyebrow %}<p class="folio">{{ eyebrow }}</p>{% endif %}
  <div class="page-head__row">
    <div>
      <h1>{{ title }}</h1>
      {% if subtitle %}<p class="lede">{{ subtitle }}</p>{% endif %}
    </div>
    {% if action_url and action_label %}<a class="btn btn--primary" href="{{ action_url }}">{{ action_label }}</a>{% endif %}
  </div>
</header>
