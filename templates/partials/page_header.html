<div class="mb-7 flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
  <div>
    {% if eyebrow %}<p class="text-sm font-bold uppercase tracking-[0.16em] text-amber-800">{{ eyebrow }}</p>{% endif %}
    <h1 class="mt-1 text-3xl font-semibold leading-tight text-stone-950 md:text-4xl">{{ title }}</h1>
    {% if subtitle %}<p class="mt-3 max-w-3xl text-base leading-7 text-stone-600">{{ subtitle }}</p>{% endif %}
  </div>
  {% if action_url and action_label %}
    <a class="btn btn-primary md:shrink-0" href="{{ action_url }}">{{ action_label }}</a>
  {% endif %}
</div>
