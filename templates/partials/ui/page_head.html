<header class="page-head">
  {% if folio %}<p class="folio">{{ folio }}</p>{% endif %}
  <div class="page-head__row">
    <div>
      <h1>{{ title }}</h1>
      {% if lede %}<p class="lede">{{ lede }}</p>{% endif %}
    </div>
    {% if action_url and action_label %}<a class="btn btn--primary" href="{{ action_url }}">{{ action_label }}</a>{% endif %}
  </div>
</header>
