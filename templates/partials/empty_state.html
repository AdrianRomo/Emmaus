<div class="empty-state">
  <p class="text-base font-semibold text-stone-950">{{ title }}</p>
  {% if body %}<p class="mx-auto mt-2 max-w-xl text-sm leading-6 text-stone-600">{{ body }}</p>{% endif %}
  {% if action_url and action_label %}
    <a class="btn btn-secondary mt-5" href="{{ action_url }}">{{ action_label }}</a>
  {% endif %}
</div>
